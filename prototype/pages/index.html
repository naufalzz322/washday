<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dfedf6">
  <meta name="description" content="Washday is a wash-and-fold laundry shop. Sign in to manage orders, offers and pickups.">
  <title>Washday · Laundry day, handled</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/welcome.css">
</head>
<body class="welcome-page">
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <div class="account-row">
      <a class="brand-lockup" href="index.html" aria-label="Washday welcome">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2c2.9 3.7 5.6 7 5.6 10.2a5.6 5.6 0 1 1-11.2 0c0-3.2 2.7-6.5 5.6-10.2Z" fill="currentColor"/><path d="M9.4 13.3c.2 1.6 1.3 2.6 2.8 2.8" fill="none" stroke="#0e1115" stroke-width="1.5" stroke-linecap="round"/></svg></span>
        <span class="brand-wordmark">Washday<svg class="brand-spark" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .6 7 5l4.4 1L7 7 6 11.4 5 7 .6 6 5 5Z" fill="currentColor"/></svg></span>
      </a>
    </div>
  </header>
  <main class="welcome-main">
    <section class="welcome-hero" aria-labelledby="welcome-title">
      <div class="welcome-copy">
        <p class="welcome-kicker">Wash &amp; fold · one shop</p>
        <h1 id="welcome-title">Laundry day,<br><span>handled.</span></h1>
        <p class="welcome-lede">Drop off your bag. We wash, fold and tell you the moment it’s ready.</p>
      </div>
      <figure class="welcome-media">
        <img src="../assets/images/login-hero.jpg" alt="Woman carrying a basket of fresh laundry in warm daylight">
        <div class="welcome-order" aria-label="Order LDR-0042, ready for pickup">
          <span class="welcome-order-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span>
          <span class="welcome-order-copy"><strong>LDR-0042</strong><small>Express · 2.00 / kg</small></span>
          <span class="welcome-order-status">Ready</span>
        </div>
      </figure>
      <a class="welcome-cta" href="login.html">Get started<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5l4.5 4.5-4.5 4.5"/></svg></a>
      <p class="welcome-meta">Track every order from drop-off to pickup.</p>
    </section>
  </main>
</body>
</html>
